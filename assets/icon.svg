<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.2"/>
      <stop offset="30%" style="stop-color:#00d4aa;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#00ffcc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00ffcc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- 背景网格线 -->
  <g opacity="0.06" stroke="white" stroke-width="1">
    <line x1="40" y1="60" x2="40" y2="200"/>
    <line x1="80" y1="60" x2="80" y2="200"/>
    <line x1="120" y1="60" x2="120" y2="200"/>
    <line x1="160" y1="60" x2="160" y2="200"/>
    <line x1="200" y1="60" x2="200" y2="200"/>
    <line x1="30" y1="90" x2="230" y2="90"/>
    <line x1="30" y1="120" x2="230" y2="120"/>
    <line x1="30" y1="150" x2="230" y2="150"/>
    <line x1="30" y1="180" x2="230" y2="180"/>
  </g>

  <!-- 脉冲线（主视觉） -->
  <polyline
    points="30,140 60,140 80,140 95,140 105,90 115,180 125,70 135,190 145,100 155,140 170,140 200,140 230,140"
    fill="none"
    stroke="url(#pulse)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- 脉冲线光晕 -->
  <polyline
    points="30,140 60,140 80,140 95,140 105,90 115,180 125,70 135,190 145,100 155,140 170,140 200,140 230,140"
    fill="none"
    stroke="#00d4aa"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glowStrong)"
    opacity="0.3"
  />

  <!-- 电量条背景 -->
  <rect x="40" y="195" width="176" height="10" rx="5" ry="5" fill="rgba(255,255,255,0.06)"/>

  <!-- 电量条填充 -->
  <rect x="40" y="195" width="132" height="10" rx="5" ry="5" fill="url(#bar)" filter="url(#glow)" opacity="0.9"/>

  <!-- 电量条上的小光点 -->
  <circle cx="172" cy="200" r="4" fill="#00ffcc" filter="url(#glow)"/>

  <!-- 右上角小圆点（状态指示） -->
  <circle cx="210" cy="50" r="5" fill="#00d4aa" filter="url(#glow)" opacity="0.8"/>
</svg>
